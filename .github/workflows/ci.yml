name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  devsecops:
    name: DevSecOps Quality & Security Gate
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - name: Harden Runner Security
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install .[dev]

      - name: Ruff Linter Check
        run: |
          ruff check .

      - name: Ruff Formatting Check
        run: |
          ruff format --check .

      - name: Mypy Static Type Verification
        run: |
          mypy src/

      - name: Bandit AST Security Audit
        run: |
          bandit -r src/

      - name: Pytest Test Suite & Coverage Gate
        run: |
          pytest --cov=src --cov-report=term-missing --cov-report=xml --cov-fail-under=90
